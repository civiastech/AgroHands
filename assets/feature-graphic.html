<!doctype html>
<!-- Google Play feature graphic, 1024×500. Rendered to PNG by scripts/play-assets.js. Keep key content away from the edges. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 85% 20%, #2f8f5a 0, #1f6f43 45%, #154f30 100%);
    color: #fff; display: flex; align-items: center; gap: 56px; padding: 0 88px; box-sizing: border-box;
  }
  .icon svg { width: 210px; height: 210px; display: block; filter: drop-shadow(0 12px 28px rgba(0,0,0,.28)); }
  h1 { font-size: 76px; margin: 0 0 14px; letter-spacing: -1.5px; }
  p { font-size: 32px; margin: 0; line-height: 1.3; color: #e8f3ec; max-width: 560px; }
  .chips { margin-top: 26px; display: flex; gap: 12px; }
  .chips span { background: #f4d35e; color: #1b3a28; font-weight: 700; font-size: 20px; padding: 8px 16px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="icon">{{ICON}}</div>
  <div>
    <h1>AgroHands</h1>
    <p>Verified farm workers. Written contracts. Fair pay on time.</p>
    <div class="chips"><span>NIN verified</span><span>Trained</span><span>5 languages</span></div>
  </div>
</body>
</html>
