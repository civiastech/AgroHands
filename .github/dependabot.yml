# Keeps CI actions and base images patched. (There are no npm dependencies to update.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /android
    schedule: { interval: monthly }
    ignore:
      # Bubblewrap and the Android Gradle plugin target JDK 17 (LTS). Take patch updates, not new majors.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
