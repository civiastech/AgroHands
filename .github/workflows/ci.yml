name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run test:coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck deploy and build scripts
        run: shellcheck deploy/*.sh android/build.sh
      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          DOMAIN=example.com BASE_URL=https://example.com SESSION_SECRET=$(openssl rand -hex 32)             docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Validate Caddyfiles
        run: |
          docker run --rm -e DOMAIN=example.com -v "$PWD/deploy:/d:ro" caddy:2-alpine caddy validate --config /d/Caddyfile.docker --adapter caddyfile
          docker run --rm -v "$PWD/deploy:/d:ro" caddy:2-alpine caddy validate --config /d/Caddyfile --adapter caddyfile

  docker:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build image (runs tests inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agrohands:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name ah -p 3000:3000 \
            -e SESSION_SECRET=$(openssl rand -hex 32) -e BASE_URL=https://ci.example \
            --read-only --tmpfs /tmp agrohands:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ah)" = healthy ] && break; sleep 1
          done
          docker logs ah
          curl -fsS localhost:3000/readyz
          curl -fsS localhost:3000/ -o /dev/null
          docker stop ah && docker logs ah 2>&1 | grep -q "stopped cleanly"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
