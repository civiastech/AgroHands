# Production override: Caddy (automatic HTTPS) in front, app not exposed directly, nightly backups.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires a .env with at least DOMAIN, BASE_URL, SESSION_SECRET (see .env.example).

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  app:
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      BASE_URL: ${BASE_URL:?set BASE_URL in .env, e.g. https://agrohands.ng}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    ports: !reset []
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. agrohands.ng}
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  backup:
    <<: *hardening
    image: ${APP_IMAGE:-agrohands:local}
    command: ["node", "--disable-warning=ExperimentalWarning", "scripts/backup.js", "--loop"]
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      BASE_URL: ${BASE_URL}
      DB_PATH: /data/agrohands.db
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - app-data:/data
      # Host folder so backups survive `docker compose down -v` and are easy to copy off-site.
      - ./backups:/backups
    healthcheck:
      disable: true

volumes:
  caddy-data:
  caddy-config:
